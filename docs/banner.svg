<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SynapseMD: clinical intelligence for high-stakes patient transitions</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#11161D" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="22%" cy="10%" r="70%">
      <stop offset="0" stop-color="#7A8CFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7A8CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="100%" r="50%">
      <stop offset="0" stop-color="#2FD08A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2FD08A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-5%" y="-60%" width="110%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1280" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="#0A0D12"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <rect width="1280" height="340" fill="url(#glow2)"/>

    <!-- logo mark -->
    <g transform="translate(88 64)">
      <rect width="72" height="72" rx="16" fill="#0E1218" stroke="#1F2733" stroke-width="1.5"/>
      <path d="M10 40 H22 L28 28 L35 52 L42 20 L49 40 H62" fill="none" stroke="#2FD08A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- wordmark -->
    <text x="184" y="120" fill="#E9EDF3" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">SynapseMD</text>
    <text x="90" y="178" fill="#9AA5B4" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500">Clinical intelligence for high-stakes patient transitions</text>
    <text x="90" y="214" fill="#5F6A79" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">What changed  ·  Why it might matter  ·  What the evidence says  ·  What is missing</text>

    <!-- live vitals chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <g transform="translate(936 54)">
        <rect width="240" height="46" rx="12" fill="#0E1218" stroke="#1F2733"/>
        <circle cx="22" cy="23" r="5" fill="#2FD08A"/>
        <text x="40" y="29" fill="#9AA5B4">HR</text><text x="224" y="29" fill="#E9EDF3" text-anchor="end">79 bpm</text>
      </g>
      <g transform="translate(936 110)">
        <rect width="240" height="46" rx="12" fill="#0E1218" stroke="#1F2733"/>
        <circle cx="22" cy="23" r="5" fill="#2FD08A"/>
        <text x="40" y="29" fill="#9AA5B4">SpO2</text><text x="224" y="29" fill="#E9EDF3" text-anchor="end">97 %</text>
      </g>
      <g transform="translate(936 166)">
        <rect width="240" height="46" rx="12" fill="#1A1710" stroke="#3A2C12"/>
        <circle cx="22" cy="23" r="5" fill="#F0B040">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="40" y="29" fill="#9AA5B4">K+</text><text x="224" y="29" fill="#F0B040" text-anchor="end">5.2 mmol/L</text>
      </g>
    </g>

    <!-- ECG: dim full trace + travelling bright sweep -->
    <path d="M0,288 L60,288 L66,279 L74,288 L96,288 L100,296 L108,242 L118,310 L124,288 L144,288 L156,274 L170,288 L200,288 L260,288 L266,279 L274,288 L296,288 L300,296 L308,242 L318,310 L324,288 L344,288 L356,274 L370,288 L400,288 L460,288 L466,279 L474,288 L496,288 L500,296 L508,242 L518,310 L524,288 L544,288 L556,274 L570,288 L600,288 L660,288 L666,279 L674,288 L696,288 L700,296 L708,242 L718,310 L724,288 L744,288 L756,274 L770,288 L800,288 L860,288 L866,279 L874,288 L896,288 L900,296 L908,242 L918,310 L924,288 L944,288 L956,274 L970,288 L1000,288 L1060,288 L1066,279 L1074,288 L1096,288 L1100,296 L1108,242 L1118,310 L1124,288 L1144,288 L1156,274 L1170,288 L1200,288 L1280,288" pathLength="1000" fill="none" stroke="#1B2330" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,288 L60,288 L66,279 L74,288 L96,288 L100,296 L108,242 L118,310 L124,288 L144,288 L156,274 L170,288 L200,288 L260,288 L266,279 L274,288 L296,288 L300,296 L308,242 L318,310 L324,288 L344,288 L356,274 L370,288 L400,288 L460,288 L466,279 L474,288 L496,288 L500,296 L508,242 L518,310 L524,288 L544,288 L556,274 L570,288 L600,288 L660,288 L666,279 L674,288 L696,288 L700,296 L708,242 L718,310 L724,288 L744,288 L756,274 L770,288 L800,288 L860,288 L866,279 L874,288 L896,288 L900,296 L908,242 L918,310 L924,288 L944,288 L956,274 L970,288 L1000,288 L1060,288 L1066,279 L1074,288 L1096,288 L1100,296 L1108,242 L1118,310 L1124,288 L1144,288 L1156,274 L1170,288 L1200,288 L1280,288" pathLength="1000" fill="none" stroke="#2FD08A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140 3000" filter="url(#blur)">
      <animate attributeName="stroke-dashoffset" values="140;-1000" dur="4.6s" repeatCount="indefinite"/>
    </path>

    <text x="1236" y="328" fill="#3C4552" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">Synthetic data  ·  Research prototype</text>
  </g>
</svg>
